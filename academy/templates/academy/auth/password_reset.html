{% extends "academy/base.html" %}
{% block title %}Reset Password | LearnHub{% endblock %}
{% block content %}
<section class="auth-page"><div class="auth-card">
    <div class="auth-heading"><span class="eyebrow">ACCOUNT RECOVERY</span><h1>Reset password</h1><p>Enter your email and we will send reset instructions.</p></div>
    <form method="post">{% csrf_token %}
        {% include "academy/partials/form_fields.html" with form=form %}
        <button class="btn btn-primary btn-full" type="submit">Send Reset Link</button>
    </form>
</div></section>
{% endblock %}
